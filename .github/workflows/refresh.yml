name: Refresh portfolio data

# Apple publishes a day's sales report the following morning Pacific, so this
# runs once that has settled. Independent of the 7am Central daily email,
# which runs from a separate machine.

on:
  schedule:
    - cron: '30 14 * * *'   # 14:30 UTC — mid-morning Central, report is up
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'How many days of history to (re)fetch'
        required: false
        default: '7'

permissions:
  contents: write
  # Lets the runner mint the OIDC token Google exchanges for credentials.
  # Without it the auth step fails with a bare "unable to get token".
  id-token: write

concurrency:
  # Two runs committing the same data file would conflict for no benefit.
  group: portfolio-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet "pyjwt[crypto]" requests google-cloud-storage

      # Google Play install figures come from a Cloud Storage bucket, which
      # needs a service account — a user login cannot run here.
      #
      # No key file. The account's org policy forbids service-account keys
      # (constraints/iam.disableServiceAccountKeyCreation), and that is the
      # better arrangement anyway: this repository is public, so a long-lived
      # credential in it would be the weakest thing here. Instead GitHub mints
      # a short-lived OIDC token and Google exchanges it, which is why the job
      # needs id-token: write above. The provider is pinned to this repository
      # by an attribute condition, so a token from anywhere else is refused.
      #
      # continue-on-error because Android is an extra: if the exchange breaks,
      # the iOS refresh should still run. play.py then reads nothing and the
      # committed Android history is left alone rather than zeroed.
      - name: Authenticate to Google Cloud
        id: play
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          project_id: app-portfolio-tooling
          workload_identity_provider: projects/919354515893/locations/global/workloadIdentityPools/github/providers/github
          service_account: play-reports-reader@app-portfolio-tooling.iam.gserviceaccount.com

      - name: Pull from App Store Connect and Google Play
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER }}
          PLAY_PROJECT: app-portfolio-tooling
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '7' }}
        run: python scripts/fetch.py

      - name: Commit if anything moved
        # The same credentials as the fetch step, because the retry below
        # regenerates the file and would otherwise run without them — a
        # silent downgrade to an empty result on exactly the run that raced.
        # GOOGLE_APPLICATION_CREDENTIALS is already exported by the auth step.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER }}
          PLAY_PROJECT: app-portfolio-tooling
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '7' }}
        run: |
          git config user.name  "portfolio-bot"
          git config user.email "actions@github.com"

          # A push can be rejected because something landed between this job's
          # checkout and now — in practice a parser change pushed by hand
          # while the schedule was running. The concurrency group above only
          # serialises this workflow against itself; it cannot know about a
          # person.
          #
          # On rejection, move onto whatever is now on the branch and
          # regenerate, rather than replaying this run's file over the top.
          # fetch.py merges onto the committed data, so regenerating keeps
          # both the accumulated history and any field a newer parser has
          # started writing. Forcing our copy over would silently drop them.
          for attempt in 1 2 3; do
            git add data/portfolio.json
            # Nothing new is the normal case on a quiet day and must not fail.
            if git diff --staged --quiet; then echo "nothing new"; exit 0; fi

            git commit -q -m "Portfolio data $(date -u +%Y-%m-%d)"
            if git push -q 2>/dev/null; then
              echo "pushed on attempt $attempt"
              exit 0
            fi

            echo "::notice::Push raced with another commit — rebuilding on top of ${GITHUB_REF_NAME}."
            git reset -q --hard HEAD~1
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            python scripts/fetch.py
          done

          echo "::error::Could not land the data after 3 attempts."
          exit 1
